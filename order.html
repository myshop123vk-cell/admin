<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustKart | ऑर्डर रसीद</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Firebase SDK -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBzdTs2FSyFkpiHoPXZkDFt15kqXVdV7Hk",
        authDomain: "mictrustkart.firebaseapp.com",
        projectId: "mictrustkart",
        storageBucket: "mictrustkart.firebasestorage.app",
        messagingSenderId: "909908206436",
        appId: "1:909908206436:web:46109721d6f6f3cf4f1071"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      window.db = db;
      window.doc = doc;
      window.getDoc = getDoc;
    </script>
</head>
<body class="bg-slate-100 min-h-screen p-4 flex items-center justify-center">

    <div class="max-w-md w-full bg-white rounded-3xl p-6 shadow-xl space-y-5 border border-slate-200/80" id="cardContainer">
        <div class="text-center py-8 text-slate-400 font-bold" id="loadingText">
            <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-emerald-600 block"></i>
            ऑर्डर विवरण लोड हो रहा है...
        </div>
    </div>

    <script>
        async function fetchSingleOrder() {
            const container = document.getElementById('cardContainer');
            const urlParams = new URLSearchParams(window.location.search);
            const orderId = urlParams.get('id');

            if (!orderId) {
                container.innerHTML = `<div class="text-center text-rose-500 font-bold">गलत आर्डर लिंक!</div>`;
                return;
            }

            try {
                // Wait for Firebase to setup
                setTimeout(async () => {
                    const docRef = window.doc(window.db, "orders", orderId);
                    const docSnap = await window.getDoc(docRef);

                    if (!docSnap.exists()) {
                        container.innerHTML = `<div class="text-center text-rose-500 font-bold">ऑर्डर नहीं मिला या डिलीट कर दिया गया है।</div>`;
                        return;
                    }

                    const order = docSnap.data();
                    const date = order.timestamp ? new Date(order.timestamp.seconds * 1000).toLocaleString('hi-IN') : 'N/A';

                    let name = (order.customerName || '').replace(/[\r\n]+/g, " ");
                    let phone = (order.phone || '').replace(/[\r\n]+/g, " ");
                    let address = `${order.village || ''} ${order.address || ''}`.replace(/[\r\n]+/g, " ");
                    let charge = (order.deliveryCharge || '').replace(/[\r\n]+/g, " ");

                    let qrText = `नाम: ${name}\nफोन: ${phone}\nपता: ${address}\nचार्ज: ${charge}`;
                    if(order.liveLocation && order.liveLocation !== "नहीं है") {
                        qrText += `\nलोकेशन: ${order.liveLocation}`;
                    }
                    let qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(qrText)}&color=065f46`;

                    let imgHtml = order.slipImageUrl && order.slipImageUrl !== "नहीं है" ? 
                        `<a href="${order.slipImageUrl}" target="_blank" class="block mt-2 text-emerald-600 underline text-xs font-black"><i class="fa-solid fa-receipt mr-1"></i>अपलोड की गई पर्ची देखें</a>` : '';

                    let mapHtml = order.liveLocation && order.liveLocation !== "नहीं है" ?
                        `<a href="${order.liveLocation}" target="_blank" class="block text-center w-full bg-amber-500 hover:bg-amber-600 text-white p-3 rounded-2xl text-xs font-bold shadow-md transition"><i class="fa-solid fa-map-location-dot mr-1"></i> गूगल मैप्स पर लाइव लोकेशन देखें</a>` : '';

                    container.innerHTML = `
                        <!-- Header -->
                        <div class="bg-emerald-700 text-white p-4 rounded-2xl text-center space-y-1 shadow-md">
                            <h2 class="text-xl font-black">TrustKart Order</h2>
                            <p class="text-[10px] opacity-80">ऑर्डर आईडी: ${orderId}</p>
                            <span class="text-[10px] bg-emerald-800/80 px-2 py-0.5 rounded-md inline-block font-bold">${order.status || 'Pending'}</span>
                        </div>

                        <!-- Customer Details -->
                        <div class="space-y-2 text-xs text-slate-700 font-medium border-b border-slate-100 pb-3">
                            <p><b>👤 ग्राहक नाम:</b> ${order.customerName || 'N/A'}</p>
                            <p><b>📞 मोबाइल:</b> <a href="tel:${order.phone}" class="text-blue-600 underline font-bold">${order.phone || 'N/A'}</a></p>
                            <p><b>🏘️ पता:</b> ${order.village || ''} - ${order.address || ''}</p>
                            <p><b>📅 तारीख:</b> ${date}</p>
                        </div>

                        <!-- Items List -->
                        <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200/60 text-xs text-slate-800 font-semibold whitespace-pre-wrap">
                            📝 <b>सामान की सूची:</b>\n${order.itemsText || 'कोई विवरण नहीं'}
                            ${imgHtml}
                        </div>

                        <!-- QR Code & Delivery Fee -->
                        <div class="bg-emerald-50/80 p-4 rounded-2xl border border-emerald-100 flex items-center justify-between gap-3">
                            <div>
                                <p class="text-[10px] font-extrabold text-emerald-800 uppercase tracking-wider">डिलीवरी चार्ज</p>
                                <p class="text-lg font-black text-emerald-700">${order.deliveryCharge || '₹0'}</p>
                            </div>
                            <div class="bg-white p-1 rounded-xl shadow-sm border border-emerald-200">
                                <img src="${qrApiUrl}" alt="QR Code" class="w-20 h-20 rounded-lg object-contain" />
                            </div>
                        </div>

                        ${mapHtml}

                        <p class="text-[10px] text-slate-400 text-center font-bold">TrustKart Express Delivery - शाम 3:00 से 7:00 बजे</p>
                    `;
                }, 1000);
            } catch (e) {
                container.innerHTML = `<div class="text-center text-rose-500 font-bold">त्रुटि: ${e.message}</div>`;
            }
        }

        window.addEventListener('DOMContentLoaded', fetchSingleOrder);
    </script>
</body>
</html>
