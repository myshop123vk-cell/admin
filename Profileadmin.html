<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TrustKart | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind:wght@400;600;700&display=swap');
        body { font-family: 'Hind', sans-serif; background: #0f172a; color: white; scroll-behavior: smooth; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .app-gradient { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .hidden { display: none; }
    </style>
</head>
<body class="pb-20 overflow-x-hidden">

    <!-- हेडर -->
    <header class="p-6 flex justify-between items-center sticky top-0 z-40 bg-[#0f172a]/90 backdrop-blur-xl border-b border-white/5">
        <h1 class="font-black text-xl tracking-[0.2em] text-emerald-400">ADMIN CONTROL</h1>
        <a href="profile.html" class="px-4 py-2 glass-card rounded-2xl text-xs font-bold text-white hover:bg-white/10 transition">Profile Page</a>
    </header>

    <main class="p-6 max-w-2xl mx-auto space-y-8">

        <!-- 1. ग्लोबल सेटिंग्स / लिंक्स एडिटर -->
        <section class="glass-card p-6 rounded-[2.5rem] space-y-4">
            <h2 class="text-lg font-black text-emerald-400 italic flex items-center gap-2">
                <i class="fa-solid fa-link"></i> ग्लोबल लिंक्स व सोशल मीडिया
            </h2>
            <div class="space-y-3">
                <div>
                    <label class="text-[10px] text-gray-400 font-bold uppercase ml-2">Play Store App Download Link</label>
                    <input type="text" id="cfgApp" placeholder="https://play.google.com/store/apps/details?id=..." class="w-full p-3 bg-white/5 rounded-2xl outline-none border border-white/10 text-sm text-emerald-400 font-bold">
                </div>
                <div>
                    <label class="text-[10px] text-gray-400 font-bold uppercase ml-2">Order Tracking Link</label>
                    <input type="text" id="cfgTrack" placeholder="track.html or External Tracking URL" class="w-full p-3 bg-white/5 rounded-2xl outline-none border border-white/10 text-sm">
                </div>
                <div>
                    <label class="text-[10px] text-gray-400 font-bold uppercase ml-2">Google Map Link</label>
                    <input type="text" id="cfgMap" placeholder="Google Map URL" class="w-full p-3 bg-white/5 rounded-2xl outline-none border border-white/10 text-sm">
                </div>
                <div>
                    <label class="text-[10px] text-gray-400 font-bold uppercase ml-2">Blog Link</label>
                    <input type="text" id="cfgBlog" placeholder="Blog Link" class="w-full p-3 bg-white/5 rounded-2xl outline-none border border-white/10 text-sm">
                </div>
                <div>
                    <label class="text-[10px] text-gray-400 font-bold uppercase ml-2">About Us Link</label>
                    <input type="text" id="cfgAbout" placeholder="About Us Link" class="w-full p-3 bg-white/5 rounded-2xl outline-none border border-white/10 text-sm">
                </div>
                <div>
                    <label class="text-[10px] text-gray-400 font-bold uppercase ml-2">AI Help Chat Link</label>
                    <input type="text" id="cfgChat" placeholder="AI Assistant URL" class="w-full p-3 bg-white/5 rounded-2xl outline-none border border-white/10 text-sm">
                </div>
                
                <hr class="border-white/10 my-2">
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[10px] text-gray-400 font-bold uppercase ml-2">WhatsApp (Only No.)</label>
                        <input type="text" id="cfgWa" placeholder="919876543210" class="w-full p-3 bg-white/5 rounded-2xl outline-none border border-white/10 text-sm">
                    </div>
                    <div>
                        <label class="text-[10px] text-gray-400 font-bold uppercase ml-2">Facebook URL</label>
                        <input type="text" id="cfgFb" placeholder="Facebook Link" class="w-full p-3 bg-white/5 rounded-2xl outline-none border border-white/10 text-sm">
                    </div>
                    <div>
                        <label class="text-[10px] text-gray-400 font-bold uppercase ml-2">Instagram URL</label>
                        <input type="text" id="cfgInsta" placeholder="Instagram Link" class="w-full p-3 bg-white/5 rounded-2xl outline-none border border-white/10 text-sm">
                    </div>
                    <div>
                        <label class="text-[10px] text-gray-400 font-bold uppercase ml-2">YouTube Handle/Link</label>
                        <input type="text" id="cfgYt" placeholder="@channel or Link" class="w-full p-3 bg-white/5 rounded-2xl outline-none border border-white/10 text-sm">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] text-gray-400 font-bold uppercase ml-2">Gmail Address</label>
                    <input type="email" id="cfgGmail" placeholder="support@trustkart.com" class="w-full p-3 bg-white/5 rounded-2xl outline-none border border-white/10 text-sm">
                </div>
            </div>
            <button onclick="saveGlobalSettings()" class="w-full app-gradient py-4 rounded-2xl font-black shadow-lg text-sm uppercase">सेटिंग्स अपडेट करें</button>
        </section>

        <!-- 2. मीडिया मैनेजर (फोटो और वीडियो प्रबंधित करें) -->
        <section class="glass-card p-6 rounded-[2.5rem] space-y-4">
            <h2 class="text-lg font-black text-emerald-400 italic flex items-center gap-2">
                <i class="fa-solid fa-photo-film"></i> मीडिया गैलरी मैनेजर
            </h2>
            <div class="space-y-3">
                <select id="mType" class="w-full p-3 bg-[#1e293b] rounded-2xl outline-none border border-white/10 text-sm text-white">
                    <option value="image">फोटो (Image URL)</option>
                    <option value="video">वीडियो (Video Embed URL)</option>
                </select>
                <input type="text" id="mUrl" placeholder="Media URL (Image Link or Video Embed Link)" class="w-full p-3 bg-white/5 rounded-2xl outline-none border border-white/10 text-sm">
                <button onclick="addMedia()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-3 rounded-2xl font-bold text-sm transition">मीडिया जोड़ें</button>
            </div>

            <!-- अपलोड की गई मीडिया की लिस्ट -->
            <div class="pt-4">
                <h3 class="text-xs font-bold text-gray-400 uppercase mb-3">मौजूदा मीडिया लिस्ट:</h3>
                <div id="adminMediaList" class="grid grid-cols-2 gap-3"></div>
            </div>
        </section>

        <!-- 3. यूज़र डेटाबेस / प्रोफाइल मैनेजर -->
        <section class="glass-card p-6 rounded-[2.5rem] space-y-4">
            <h2 class="text-lg font-black text-emerald-400 italic flex items-center gap-2">
                <i class="fa-solid fa-users"></i> यूज़र प्रोफाइल एडिटर
            </h2>
            <p class="text-xs text-gray-400">नीचे किसी भी पंजीकृत यूज़र की जानकारी अपडेट करें:</p>
            <div id="usersList" class="space-y-4"></div>
        </section>

    </main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCvzZQ98rot6DIlaCN87eO-QsK3zzJHlp0",
        authDomain: "trustkart-d3d8f.firebaseapp.com",
        projectId: "trustkart-d3d8f",
        storageBucket: "trustkart-d3d8f.firebasestorage.app",
        messagingSenderId: "643370824475",
        appId: "1:643370824475:web:5c7f3367b61e333bb1d9be"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 1. लोड और सेव ग्लोबल सेटिंग्स
    async function loadGlobalSettings() {
        const docRef = doc(db, "settings", "global");
        const snap = await getDoc(docRef);
        if (snap.exists()) {
            const d = snap.data();
            document.getElementById('cfgApp').value = d.appUrl || "";
            document.getElementById('cfgTrack').value = d.track || "track.html";
            document.getElementById('cfgMap').value = d.map || "";
            document.getElementById('cfgBlog').value = d.blog || "";
            document.getElementById('cfgAbout').value = d.about || "";
            document.getElementById('cfgChat').value = d.chat || "";
            document.getElementById('cfgWa').value = d.wa || "";
            document.getElementById('cfgFb').value = d.fb || "";
            document.getElementById('cfgInsta').value = d.insta || "";
            document.getElementById('cfgYt').value = d.yt || "";
            document.getElementById('cfgGmail').value = d.gmail || "";
        }
    }

    window.saveGlobalSettings = async () => {
        try {
            await setDoc(doc(db, "settings", "global"), {
                appUrl: document.getElementById('cfgApp').value,
                track: document.getElementById('cfgTrack').value,
                map: document.getElementById('cfgMap').value,
                blog: document.getElementById('cfgBlog').value,
                about: document.getElementById('cfgAbout').value,
                chat: document.getElementById('cfgChat').value,
                wa: document.getElementById('cfgWa').value,
                fb: document.getElementById('cfgFb').value,
                insta: document.getElementById('cfgInsta').value,
                yt: document.getElementById('cfgYt').value,
                gmail: document.getElementById('cfgGmail').value
            }, { merge: true });
            alert("सभी ग्लोबल सेटिंग्स सफलतापूर्वक सुरक्षित हो गईं!");
        } catch (e) {
            alert("Error: " + e.message);
        }
    };

    // 2. मीडिया मैनेजर
    window.addMedia = async () => {
        const type = document.getElementById('mType').value;
        const url = document.getElementById('mUrl').value;
        if (!url) return alert("कृपया valid Media URL दर्ज करें!");

        try {
            await addDoc(collection(db, "media"), { type, url });
            document.getElementById('mUrl').value = "";
            alert("मीडिया सफलतापूर्वक जोड़ दिया गया!");
        } catch (e) {
            alert("Error: " + e.message);
        }
    };

    window.deleteMedia = async (id) => {
        if (confirm("क्या आप वाकई इसे हटाना चाहते हैं?")) {
            await deleteDoc(doc(db, "media", id));
        }
    };

    function syncMediaList() {
        onSnapshot(collection(db, "media"), (snapshot) => {
            const box = document.getElementById('adminMediaList');
            box.innerHTML = "";
            snapshot.forEach((docItem) => {
                const data = docItem.data();
                const id = docItem.id;
                let preview = data.type === 'image' 
                    ? `<img src="${data.url}" class="h-24 w-full object-cover rounded-xl">` 
                    : `<iframe src="${data.url}" class="h-24 w-full rounded-xl"></iframe>`;

                box.innerHTML += `
                    <div class="relative bg-white/5 p-2 rounded-2xl border border-white/10 group">
                        ${preview}
                        <button onclick="deleteMedia('${id}')" class="absolute top-3 right-3 bg-red-600 text-white h-7 w-7 rounded-full flex items-center justify-center text-xs shadow-lg">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
            });
        });
    }

    // 3. यूज़र प्रोफाइल एडिटर
    function syncUsers() {
        onSnapshot(collection(db, "users"), (snapshot) => {
            const box = document.getElementById('usersList');
            box.innerHTML = "";
            snapshot.forEach((uDoc) => {
                const uid = uDoc.id;
                const u = uDoc.data();
                box.innerHTML += `
                    <div class="bg-white/5 p-4 rounded-2xl border border-white/10 space-y-3">
                        <p class="text-[10px] text-emerald-400 font-mono font-bold">UID: ${uid}</p>
                        <div class="space-y-2">
                            <input type="text" id="uName_${uid}" value="${u.name || ''}" placeholder="नाम" class="w-full p-2 bg-black/30 rounded-xl text-xs border border-white/5">
                            <input type="text" id="uPhone_${uid}" value="${u.phone || ''}" placeholder="फोन" class="w-full p-2 bg-black/30 rounded-xl text-xs border border-white/5">
                            <input type="text" id="uImg_${uid}" value="${u.img || ''}" placeholder="फोटो लिंक" class="w-full p-2 bg-black/30 rounded-xl text-xs border border-white/5">
                            <textarea id="uAddr_${uid}" placeholder="पता" class="w-full p-2 bg-black/30 rounded-xl text-xs border border-white/5" rows="2">${u.address || ''}</textarea>
                        </div>
                        <button onclick="updateUserData('${uid}')" class="w-full bg-blue-600 hover:bg-blue-500 py-2 rounded-xl text-xs font-bold">अपडेट यूज़र डेटा</button>
                    </div>
                `;
            });
        });
    }

    window.updateUserData = async (uid) => {
        try {
            await setDoc(doc(db, "users", uid), {
                name: document.getElementById(`uName_${uid}`).value,
                phone: document.getElementById(`uPhone_${uid}`).value,
                img: document.getElementById(`uImg_${uid}`).value,
                address: document.getElementById(`uAddr_${uid}`).value
            }, { merge: true });
            alert("यूज़र डेटा अपडेट हो गया!");
        } catch (e) {
            alert("Error: " + e.message);
        }
    };

    // इनिशियलाइजेशन
    loadGlobalSettings();
    syncMediaList();
    syncUsers();
</script>
</body>
</html>
